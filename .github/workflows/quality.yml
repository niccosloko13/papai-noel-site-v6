name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  checkout-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium webkit
      - name: Check build output and syntax
        run: npm run build
      - name: Validate Pix payload format and CRC
        run: node --test tests/pix-payload.test.js
      - name: Test iPhone Safari, direct-ad campaign, checkout and account
        run: npx playwright test tests/checkout-responsive.spec.js tests/customer-ux.spec.js tests/full-site-iphone.spec.js tests/santa-letter-mobile.spec.js tests/hero-product-focus.spec.js tests/conversion-journey.spec.js tests/compact-home.spec.js
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-safari-and-checkout-results
          path: test-results/
          if-no-files-found: ignore
