name: Mobile Commerce QA

concurrency:
  group: mobile-commerce-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - feat/mobile-commerce-rebuild
  pull_request:
    branches:
      - main

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-qa
          path: qa/screenshots
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-failures
          path: test-results
          if-no-files-found: ignore
