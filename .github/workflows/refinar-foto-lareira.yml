name: Refinar foto da Lareira Feliz
on:
  push:
    paths:
      - '.github/workflows/refinar-foto-lareira.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  melhorar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar bibliotecas
        run: python -m pip install -q Pillow opencv-contrib-python-headless
      - name: Aplicar upscaling à foto original comprimida do site
        run: |
          python - <<'PY'
          import os, cv2, urllib.request
          from PIL import Image, ImageEnhance, ImageFilter
          src='assets/lareira-feliz-real.webp'
          im=Image.open(src).convert('RGB')
          print("Input photo:", im.size)
          if im.width >= 600:
              print("No upscale required")
              raise SystemExit(0)
          model='/tmp/FSRCNN_x4.pb'
          dest='assets/lareira-feliz-real.webp'
          upscale=None
          try:
              urllib.request.urlretrieve('https://github.com/Saafke/FSRCNN_Tensorflow/raw/master/models/FSRCNN_x4.pb',model)
              sr=cv2.dnn_superres.DnnSuperResImpl_create()
              sr.readModel(model)
              sr.setModel('fsrcnn',4)
              import numpy as np
              a=np.array(im)
              upscale=Image.fromarray(cv2.cvtColor(sr.upsample(cv2.cvtColor(a,cv2.COLOR_RGB2BGR)),cv2.COLOR_BGR2RGB))
          except Exception as e:
              print("Super resolution fallback:",e)
              upscale=im.resize((im.width*4,im.height*4),Image.Resampling.LANCZOS)
          # Arte impressa preservada; sem objetos novos nem mudança de composição
          upscale=ImageEnhance.Contrast(upscale).enhance(1.045)
          upscale=ImageEnhance.Sharpness(upscale).enhance(1.12)
          upscale.save(dest,'WEBP',quality=86,method=6)
          print('Output photo:',upscale.size,os.path.getsize(dest))
          PY
      - name: Atualizar fotografia
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/lareira-feliz-real.webp
          git diff --cached --quiet || (git commit -m "Melhora nitidez da fotografia principal com super resolução" && git push)
